name: Test Server Output and Environment Variable
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          server: https://octopus.example.com/
          api_key: API-FAKEAPIKEY12345678901234567890
      - name: Assert server output or graceful failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SERVER_OUT: ${{ steps.action.outputs.server }}
        run: |
          echo "outcome: $OUTCOME"
          echo "server output: $SERVER_OUT"
          if [ "$OUTCOME" = "success" ]; then
            # If the action succeeded, the server output must match the input
            if [ "$SERVER_OUT" != "https://octopus.example.com/" ]; then
              echo "FAIL: expected server output 'https://octopus.example.com/' but got '$SERVER_OUT'"
              exit 1
            fi
            echo "PASS: server output matches input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cannot reach fake Octopus server)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
