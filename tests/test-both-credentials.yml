name: Test supplying both credentials fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          server: https://octopus.example.com/
          api_key: API-TESTKEY1234567890
          service_account_id: 00000000-0000-0000-0000-000000000000
      - name: Assert action failed and exported nothing
        env:
          OUTCOME: ${{ steps.action.outcome }}
          API_KEY_OUT: ${{ steps.action.outputs.api_key }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both api_key and service_account_id are given"
            exit 1
          fi
          if [ -n "$API_KEY_OUT" ] || [ -n "$OCTOPUS_URL" ] || [ -n "$OCTOPUS_API_KEY" ]; then
            echo "FAIL: nothing should be exported on failure"
            exit 1
          fi
          echo "PASS"
