name: Test OIDC service account login
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          server: https://octopus.example.com/
          service_account_id: 00000000-0000-0000-0000-000000000001
      - name: Assert action ran and handled OIDC failure gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SERVER_OUT: ${{ steps.action.outputs.server }}
          ACCESS_TOKEN_OUT: ${{ steps.action.outputs.access_token }}
        run: |
          echo "outcome: $OUTCOME"
          echo "server output: $SERVER_OUT"
          echo "access_token output: $ACCESS_TOKEN_OUT"
          if [ "$OUTCOME" = "success" ]; then
            # If somehow succeeded, verify outputs are set
            if [ -z "$SERVER_OUT" ]; then
              echo "FAIL: action succeeded but server output is empty"
              exit 1
            fi
            if [ -z "$ACCESS_TOKEN_OUT" ]; then
              echo "FAIL: action succeeded but access_token output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with server='$SERVER_OUT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (OIDC not available in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
