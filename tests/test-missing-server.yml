name: Test missing server fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          server: ""
          api_key: API-TESTKEY1234567890
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when server is empty"
            exit 1
          fi
          if [ -n "$OCTOPUS_API_KEY" ]; then
            echo "FAIL: OCTOPUS_API_KEY should not be exported on failure"
            exit 1
          fi
          echo "PASS"
