name: Test login with no authentication method
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          server: https://octopus.example.com/
          # Neither api_key nor service_account_id provided

      - name: Assert action fails gracefully when no auth method is provided
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no authentication method was provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without an authentication method"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
