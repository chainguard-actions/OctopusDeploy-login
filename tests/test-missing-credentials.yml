name: Test missing credentials fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          server: https://octopus.example.com/
      - name: Assert action failed and exported nothing
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SERVER_OUT: ${{ steps.action.outputs.server }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when neither api_key nor service_account_id is given"
            exit 1
          fi
          if [ -n "$SERVER_OUT" ] || [ -n "$OCTOPUS_URL" ] || [ -n "$OCTOPUS_API_KEY" ]; then
            echo "FAIL: nothing should be exported on failure"
            exit 1
          fi
          echo "PASS"
