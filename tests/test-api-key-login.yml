name: Test API Key Login
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          server: https://octopus.example.com/
          api_key: API-FAKEAPIKEY12345678901234567890
      - name: Assert action ran and produced expected outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SERVER_OUT: ${{ steps.action.outputs.server }}
          API_KEY_OUT: ${{ steps.action.outputs.api_key }}
        run: |
          echo "outcome: $OUTCOME"
          echo "server output: $SERVER_OUT"
          echo "api_key output: $API_KEY_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SERVER_OUT" ]; then
              echo "FAIL: action succeeded but server output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with server='$SERVER_OUT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cannot reach fake Octopus server)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
